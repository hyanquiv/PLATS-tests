<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Escudo simplificado Poder Judicial Perú -->
  <rect width="100" height="100" rx="12" fill="#6B0000"/>

  <!-- Balanza de justicia -->
  <g fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round">
    <!-- Palo central -->
    <line x1="50" y1="22" x2="50" y2="72"/>
    <!-- Base -->
    <line x1="36" y1="72" x2="64" y2="72"/>
    <!-- Travesaño -->
    <line x1="26" y1="34" x2="74" y2="34"/>
    <!-- Cadenas izq -->
    <line x1="26" y1="34" x2="26" y2="48"/>
    <!-- Cadenas der -->
    <line x1="74" y1="34" x2="74" y2="48"/>
  </g>

  <!-- Platillos -->
  <ellipse cx="26" cy="50" rx="10" ry="4" fill="#FFD700"/>
  <ellipse cx="74" cy="50" rx="10" ry="4" fill="#FFD700"/>

  <!-- Punta del palo -->
  <circle cx="50" cy="22" r="3" fill="#FFD700"/>

  <!-- Texto PJ -->
  <text x="50" y="92" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="10"
        font-weight="bold" fill="#FFD700" letter-spacing="1">PJ</text>
</svg>
