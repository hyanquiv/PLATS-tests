events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolver de Docker — permite resolución DNS dinámica (no falla si el host no existe al arrancar)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Frontend SPA
        location / {
            set $upstream_ui http://plats-ui:80;
            proxy_pass         $upstream_ui;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API unificada → bot (PostgreSQL)
        location /api/ {
            set $upstream_bot http://plats-bot:3001;
            proxy_pass         $upstream_bot/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend mock PLATS (solo testing — activo con --profile mock)
        location /plats/ {
            set $upstream_mock http://plats-mock:8080;
            proxy_pass         $upstream_mock/plats/;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade         $http_upgrade;
            proxy_set_header   Connection      "upgrade";
            proxy_read_timeout 86400s;
        }

        # Panel QR WhatsApp
        location /openwa/ {
            set $upstream_openwa http://plats-openwa:8083;
            proxy_pass         $upstream_openwa/;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
        }

        location = /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
