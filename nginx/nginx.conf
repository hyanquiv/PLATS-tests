events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Backend: en modo mock usa el contenedor plats-mock
    #            en producción apunta al servidor Java real
    upstream plats_backend {
        server plats-mock:8080;
        # PRODUCCIÓN: comentar la línea de arriba y descomentar la de abajo
        # server 172.28.0.150:8080;
    }

    upstream plats_frontend {
        server plats-ui:80;
    }

    upstream plats_bot_panel {
        server plats-bot:3001;
    }

    server {
        listen 80;
        server_name _;

        # SPA frontend moderno
        location / {
            proxy_pass         http://plats_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API + WebSocket PLATS
        location /plats/ {
            proxy_pass         http://plats_backend/plats/;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade         $http_upgrade;
            proxy_set_header   Connection      "upgrade";
            proxy_read_timeout 86400s;
        }

        # Panel QR del bot
        location /bot/ {
            proxy_pass         http://plats_bot_panel/;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
