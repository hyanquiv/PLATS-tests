events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream plats_frontend { server plats-ui:80; }
    upstream plats_backend  { server plats-mock:8080; }
    upstream plats_bot      { server plats-bot:3001; }
    upstream plats_openwa   { server plats-openwa:8083; }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass         http://plats_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /plats/ {
            proxy_pass         http://plats_backend/plats/;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade         $http_upgrade;
            proxy_set_header   Connection      "upgrade";
            proxy_read_timeout 86400s;
        }

        location /bot/ {
            proxy_pass         http://plats_bot/;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /openwa/ {
            proxy_pass         http://plats_openwa/;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        location = /health {
            return 200 '{"status":"ok","version":"3.0"}';
            add_header Content-Type application/json;
        }
    }
}
